<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yomizakura — NonFandomDesigns</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #090609;
  font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   LANDING PAGE
========================= */

.landing {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;

  background:
    radial-gradient(circle at center, #160b16 0%, #090609 65%);

  transition: opacity 0.8s ease;
}

/* TITLE */

.title {
  position: absolute;
  top: 6%;
  left: 50%;
  transform: translateX(-50%);

  z-index: 10;

  color: #ff4fa3;

  font-size: clamp(38px, 6vw, 82px);
  font-weight: 800;

  letter-spacing: 0.18em;
  text-align: center;

  text-shadow:
    0 0 8px rgba(255,79,163,0.7),
    0 0 25px rgba(255,79,163,0.35);
}

.subtitle {
  position: absolute;
  top: 15%;
  left: 50%;
  transform: translateX(-50%);

  z-index: 10;

  color: #ff7ab8;

  font-size: clamp(11px, 1.4vw, 18px);
  letter-spacing: 0.25em;

  text-align: center;
  white-space: nowrap;
}

/* =========================
   TREE
========================= */

.tree {
  position: absolute;

  left: 50%;
  top: 55%;

  width: min(72vw, 760px);
  max-height: 72vh;

  object-fit: contain;

  transform: translate(-50%, -50%);
  transform-origin: 50% 65%;

  z-index: 4;

  filter:
    drop-shadow(0 0 12px rgba(255,79,163,0.18))
    drop-shadow(0 0 35px rgba(255,79,163,0.10));

  animation: treeSway 7s ease-in-out infinite;
}

@keyframes treeSway {
  0%, 100% {
    transform:
      translate(-50%, -50%)
      rotate(-0.7deg)
      scale(1);
  }

  50% {
    transform:
      translate(-50%, -50%)
      rotate(0.7deg)
      scale(1.015);
  }
}

/* =========================
   ENTER BUTTON
========================= */

.enter {
  position: absolute;

  left: 50%;
  bottom: 7%;

  transform: translateX(-50%);

  z-index: 20;

  padding: 14px 28px;

  border: 1px solid #ff4fa3;
  border-radius: 4px;

  background: rgba(9,6,9,0.75);

  color: #ff4fa3;

  font-size: 15px;
  letter-spacing: 0.2em;

  cursor: pointer;

  box-shadow:
    0 0 12px rgba(255,79,163,0.25);

  transition:
    background 0.3s ease,
    color 0.3s ease,
    box-shadow 0.3s ease,
    transform 0.3s ease;
}

.enter:hover {
  background: #ff4fa3;
  color: #090609;

  box-shadow:
    0 0 25px rgba(255,79,163,0.7);

  transform: translateX(-50%) scale(1.05);
}

/* =========================
   FALLING CHERRY BLOSSOMS
========================= */

.petal {
  position: absolute;

  top: -30px;

  width: 7px;
  height: 10px;

  background: #ff77b7;

  border-radius: 70% 30% 70% 30%;

  opacity: 0.8;

  z-index: 6;

  animation-name: fall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.p1 { left: 8%;  animation-duration: 8s;  animation-delay: 0s; }
.p2 { left: 18%; animation-duration: 10s; animation-delay: 2s; }
.p3 { left: 30%; animation-duration: 7s;  animation-delay: 1s; }
.p4 { left: 42%; animation-duration: 11s; animation-delay: 4s; }
.p5 { left: 55%; animation-duration: 8s;  animation-delay: 3s; }
.p6 { left: 67%; animation-duration: 10s; animation-delay: 1s; }
.p7 { left: 78%; animation-duration: 7s;  animation-delay: 5s; }
.p8 { left: 90%; animation-duration: 9s;  animation-delay: 2s; }

@keyframes fall {
  0% {
    transform:
      translate3d(0, -20px, 0)
      rotate(0deg);
  }

  25% {
    transform:
      translate3d(35px, 25vh, 0)
      rotate(90deg);
  }

  50% {
    transform:
      translate3d(-25px, 50vh, 0)
      rotate(180deg);
  }

  75% {
    transform:
      translate3d(40px, 75vh, 0)
      rotate(270deg);
  }

  100% {
    transform:
      translate3d(-10px, 110vh, 0)
      rotate(360deg);
  }
}

/* =========================
   CHARACTER HUB
========================= */

.world {
  position: relative;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  background:
    radial-gradient(circle at center, #180b18 0%, #090609 72%);

  color: #ff4fa3;

  opacity: 0;

  animation: worldFade 1.2s ease forwards;
}

@keyframes worldFade {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

/* HUB TITLE */

.hubTitle {
  position: absolute;

  top: 5%;
  left: 50%;

  transform: translateX(-50%);

  z-index: 10;

  text-align: center;

  color: #ff4fa3;

  font-size: clamp(30px, 5vw, 64px);

  font-weight: 800;

  letter-spacing: 0.18em;

  text-shadow:
    0 0 10px rgba(255,79,163,0.7),
    0 0 30px rgba(255,79,163,0.35);
}

.hubSubtitle {
  position: absolute;

  top: 13%;

  left: 50%;

  transform: translateX(-50%);

  z-index: 10;

  color: #ff7ab8;

  font-size: clamp(10px, 1.2vw, 16px);

  letter-spacing: 0.25em;

  white-space: nowrap;
}

/* =========================
   SAKURAMA
========================= */

.sakurama {
  position: absolute;

  left: 50%;
  top: 53%;

  transform:
    translate(-50%, -50%)
    scale(1);

  width: min(42vw, 500px);
  max-height: 68vh;

  object-fit: contain;

  z-index: 8;

  cursor: pointer;

  filter:
    drop-shadow(0 0 14px rgba(255,79,163,0.35))
    drop-shadow(0 0 40px rgba(255,79,163,0.15));

  transition:
    transform 0.5s ease,
    filter 0.5s ease;
}

.sakurama:hover {
  transform:
    translate(-50%, -50%)
    scale(1.04);

  filter:
    drop-shadow(0 0 20px rgba(255,79,163,0.65))
    drop-shadow(0 0 55px rgba(255,79,163,0.3));
}

/* =========================
   SAKURAMA NAME
========================= */

.sakuramaName {
  position: absolute;

  left: 50%;
  top: 87%;

  transform: translateX(-50%);

  z-index: 12;

  color: #ff4fa3;

  font-size: clamp(18px, 2vw, 28px);

  font-weight: 700;

  letter-spacing: 0.2em;

  opacity: 0.9;

  text-shadow:
    0 0 10px rgba(255,79,163,0.6);

  text-align: center;

  cursor: pointer;

  transition:
    color 0.3s ease,
    text-shadow 0.3s ease;
}

.sakuramaName span {
  display: block;

  margin-top: 7px;

  color: #ff7ab8;

  font-size: clamp(8px, 0.9vw, 12px);

  letter-spacing: 0.16em;

  opacity: 0;

  transform: translateY(-5px);

  transition:
    opacity 0.3s ease,
    transform 0.3s ease;
}

.sakurama:hover + .sakuramaName,
.sakuramaName:hover {
  color: #ff77b7;

  text-shadow:
    0 0 15px rgba(255,79,163,0.8);
}

.sakurama:hover + .sakuramaName span,
.sakuramaName:hover span,
.sakuramaName.mobileOpen span {
  opacity: 1;
  transform: translateY(0);
}

/* =========================
   CHARACTER POSITIONS
========================= */

.characterPlaceholder {
  position: absolute;

  z-index: 7;

  color: #ff7ab8;

  font-size: clamp(10px, 1.2vw, 15px);

  letter-spacing: 0.15em;

  opacity: 0.65;

  text-align: center;
}

.kurogi {
  left: 16%;
  top: 30%;
}

.sakuyo {
  left: 18%;
  top: 67%;
}

.aoma {
  right: 12%;
  top: 76%;
}

/* =========================
   IKA & IKO
========================= */

.ikoka {
  position: absolute;

  right: 5%;
  top: 15%;

  width: min(30vw, 360px);
  max-height: 52vh;

  object-fit: contain;

  z-index: 9;

  cursor: pointer;

  filter:
    drop-shadow(0 0 14px rgba(255,79,163,0.30))
    drop-shadow(0 0 35px rgba(255,79,163,0.12));

  transition:
    transform 0.4s ease,
    filter 0.4s ease;
}

.ikoka:hover,
.ikoka.mobileOpen {
  transform: scale(1.04);

  filter:
    drop-shadow(0 0 20px rgba(255,79,163,0.65))
    drop-shadow(0 0 50px rgba(255,79,163,0.25));
}

.ikokaName {
  position: absolute;

  right: 10%;
  top: 62%;

  z-index: 12;

  color: #ff7ab8;

  font-size: clamp(12px, 1.4vw, 18px);
  font-weight: 700;

  letter-spacing: 0.18em;

  text-align: center;

  cursor: pointer;

  text-shadow:
    0 0 10px rgba(255,79,163,0.5);
}

.ikokaName span {
  display: block;

  margin-top: 6px;

  font-size: clamp(7px, 0.8vw, 10px);

  letter-spacing: 0.14em;

  opacity: 0;

  transform: translateY(-5px);

  transition:
    opacity 0.3s ease,
    transform 0.3s ease;
}

.ikoka:hover + .ikokaName span,
.ikokaName:hover span,
.ikokaName.mobileOpen span {
  opacity: 1;
  transform: translateY(0);
}

/* =========================
   SUBTLE PETALS ON HUB
========================= */

.hubPetal {
  position: absolute;

  width: 6px;
  height: 9px;

  background: #ff77b7;

  border-radius: 70% 30% 70% 30%;

  opacity: 0.65;

  animation: hubFall linear infinite;
}

.hp1 { left: 10%; top: -20px; animation-duration: 9s; }
.hp2 { left: 25%; top: -40px; animation-duration: 12s; animation-delay: 2s; }
.hp3 { left: 45%; top: -30px; animation-duration: 8s; animation-delay: 1s; }
.hp4 { left: 65%; top: -20px; animation-duration: 11s; animation-delay: 3s; }
.hp5 { left: 85%; top: -30px; animation-duration: 9s; animation-delay: 4s; }

@keyframes hubFall {
  0% {
    transform: translate(0, -20px) rotate(0deg);
  }

  50% {
    transform: translate(35px, 50vh) rotate(180deg);
  }

  100% {
    transform: translate(-20px, 110vh) rotate(360deg);
  }
}

/* =========================
   NONFANDOMDESIGNS QUICK MENU
========================= */

.quickMenu {
  position: fixed;
  top: 22px;
  left: 22px;
  z-index: 1000;
}

.logoButton {
  width: 96px;
  height: 96px;

  padding: 4px;

  border: 1px solid rgba(255,79,163,0.45);
  border-radius: 50%;

  background: rgba(9,6,9,0.78);

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow:
    0 0 12px rgba(255,79,163,0.18);

  transition:
    transform 0.3s ease,
    border-color 0.3s ease,
    box-shadow 0.3s ease;
}

.logoButton:hover {
  transform: scale(1.06);

  border-color: #ff4fa3;

  box-shadow:
    0 0 20px rgba(255,79,163,0.45);
}

.logoButton img {
  width: 100%;
  height: 100%;

  object-fit: contain;

  border-radius: 50%;
}

.quickMenuPanel {
  position: absolute;

  top: 108px;
  left: 0;

  width: 270px;

  padding: 12px;

  border: 1px solid rgba(255,79,163,0.4);
  border-radius: 8px;

  background:
    linear-gradient(
      145deg,
      rgba(20,9,20,0.97),
      rgba(7,5,8,0.97)
    );

  box-shadow:
    0 0 25px rgba(255,79,163,0.18);

  opacity: 0;
  visibility: hidden;

  transform: translateY(-8px);

  transition:
    opacity 0.3s ease,
    visibility 0.3s ease,
    transform 0.3s ease;
}

.quickMenu.open .quickMenuPanel {
  opacity: 1;
  visibility: visible;

  transform: translateY(0);
}

.menuBrand {
  padding: 7px 8px 13px;

  color: #ff4fa3;

  font-size: 11px;
  font-weight: 700;

  letter-spacing: 0.18em;

  text-align: center;

  border-bottom:
    1px solid rgba(255,79,163,0.18);

  margin-bottom: 6px;
}

.quickMenuPanel a,
.quickMenuPanel button {
  display: block;

  width: 100%;

  box-sizing: border-box;

  padding: 12px 10px;

  border: 0;
  border-bottom:
    1px solid rgba(255,79,163,0.12);

  background: transparent;

  color: #ff7ab8;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;

  letter-spacing: 0.12em;

  text-align: left;

  text-decoration: none;

  cursor: pointer;

  transition:
    color 0.25s ease,
    background 0.25s ease,
    padding-left 0.25s ease;
}

.quickMenuPanel a:hover,
.quickMenuPanel button:hover {
  color: #ffffff;

  background: rgba(255,79,163,0.12);

  padding-left: 16px;
}

.quickMenuPanel a:last-child,
.quickMenuPanel button:last-child {
  border-bottom: 0;
}

/* =========================
   COMING SOON MESSAGE
========================= */

.comingSoon {
  position: fixed;

  left: 50%;
  bottom: 35px;

  transform:
    translateX(-50%)
    translateY(15px);

  z-index: 2000;

  padding: 12px 20px;

  border: 1px solid rgba(255,79,163,0.5);
  border-radius: 5px;

  background: rgba(9,6,9,0.95);

  color: #ff7ab8;

  font-size: 11px;

  letter-spacing: 0.15em;

  opacity: 0;
  visibility: hidden;

  transition:
    opacity 0.3s ease,
    transform 0.3s ease,
    visibility 0.3s ease;

  white-space: nowrap;
}

.comingSoon.show {
  opacity: 1;
  visibility: visible;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .title {
    top: 5%;
    font-size: 36px;
  }

  .subtitle {
    top: 13%;
    font-size: 9px;
  }

  .tree {
    width: 95vw;
    top: 53%;
  }

  .enter {
    bottom: 5%;
    font-size: 12px;
    padding: 12px 20px;
  }

  .sakurama {
    width: 62vw;
    max-height: 58vh;
  }

  .hubTitle {
    top: 5%;
    font-size: 30px;
  }

  .hubSubtitle {
    top: 13%;
    font-size: 8px;
  }

  .characterPlaceholder {
    font-size: 9px;
  }

  .kurogi {
    left: 5%;
    top: 27%;
  }

  .sakuyo {
    left: 7%;
    top: 72%;
  }

  .aoma {
    right: 5%;
    top: 72%;
  }

  /* =========================
     MOBILE IKA & IKO
  ========================= */

  .ikoka {
    right: 2%;
    top: 18%;

    width: 32vw;
    max-height: 35vh;
  }

  .ikokaName {
    right: 2%;
    top: 30%;

    width: 32vw;

    font-size: 10px;
    text-align: center;
  }

  .ikokaName span {
    display: block;

    margin-top: 5px;

    font-size: 7px;

    opacity: 0;

    transform: translateY(-5px);

    text-align: center;

    transition:
      opacity 0.3s ease,
      transform 0.3s ease;
  }

  .ikokaName.mobileOpen span {
    opacity: 0.8;
    transform: translateY(0);
  }

  /* =========================
     MOBILE SAKURAMA
  ========================= */

  .sakuramaName {
    top: 78%;
  }

  .sakuramaName span {
    font-size: 8px;
    margin-top: 5px;
  }

  /* =========================
     MOBILE QUICK MENU
  ========================= */

  .quickMenu {
    top: auto;
    bottom: 18px;
    left: 14px;
  }

  .logoButton {
    width: 60px;
    height: 60px;
  }

  .quickMenuPanel {
    top: auto;
    bottom: 72px;
    width: min(260px, calc(100vw - 40px));
  }

  .comingSoon {
    max-width: calc(100vw - 50px);
    text-align: center;
    white-space: normal;
  }
}
</style>
</head>

<body>

<!-- =========================
     NONFANDOMDESIGNS QUICK MENU
========================= -->

<div class="quickMenu" id="quickMenu">

  <button
    class="logoButton"
    onclick="toggleQuickMenu(event)"
    aria-label="Open NonFandomDesigns quick menu"
  >
    <img
      src="./IMG_6754.PNG"
      alt="NonFandomDesigns"
    >
  </button>

  <div class="quickMenuPanel">

    <div class="menuBrand">
      NONFANDOMDESIGNS
    </div>

    <a href="characters.html">
      CHARACTERS &amp; WORLD LORE
    </a>

    <button onclick="showComingSoon('CUSTOM RUG ORDERS')">
      CUSTOM RUG ORDERS
    </button>

    <button onclick="showComingSoon('AVAILABLE RUGS')">
      AVAILABLE RUGS
    </button>

    <a href="contact.html">
      INFO &amp; CONTACT
    </a>

    <button onclick="showComingSoon('SOCIAL MEDIA')">
      SOCIAL MEDIA
    </button>

  </div>

</div>

<div class="comingSoon" id="comingSoon"></div>

<!-- =========================
     LANDING PAGE
========================= -->

<div class="landing">

  <div class="title">YOMIZAKURA</div>

  <div class="subtitle">
    HANDCRAFTED RUGS · NONFANDOMDESIGNS
  </div>

  <img
    class="tree"
    src="./IMG_6683.PNG"
    alt="Yomizakura"
  >

  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="petal p5"></div>
  <div class="petal p6"></div>
  <div class="petal p7"></div>
  <div class="petal p8"></div>

  <button class="enter" onclick="enterSite()">
    ENTER YOMIZAKURA
  </button>

</div>

<script>

/* =========================
   QUICK MENU
========================= */

function toggleQuickMenu(event) {

  event.stopPropagation();

  const menu = document.getElementById("quickMenu");

  menu.classList.toggle("open");
}

document.addEventListener("click", function(event) {

  const menu = document.getElementById("quickMenu");

  if (!menu.contains(event.target)) {
    menu.classList.remove("open");
  }
});

function showComingSoon(pageName) {

  const message = document.getElementById("comingSoon");

  message.textContent =
    pageName + " · COMING SOON";

  message.classList.add("show");

  document
    .getElementById("quickMenu")
    .classList.remove("open");

  clearTimeout(window.comingSoonTimer);

  window.comingSoonTimer = setTimeout(() => {
    message.classList.remove("show");
  }, 2200);
}

/* =========================
   SAKURAMA CLICK
========================= */

let sakuramaMobileReady = false;

function openSakurama(event) {

  if (window.innerWidth <= 600) {

    if (!sakuramaMobileReady) {

      event.preventDefault();

      sakuramaMobileReady = true;

      const name =
        document.querySelector(".sakuramaName");

      if (name) {
        name.classList.add("mobileOpen");
      }

      return;
    }
  }

  window.location.href = "characters.html";
}

/* =========================
   IKA & IKO CLICK
========================= */

let ikokaMobileReady = false;

function openIkoka(event) {

  if (window.innerWidth <= 600) {

    if (!ikokaMobileReady) {

      event.preventDefault();

      ikokaMobileReady = true;

      const image =
        document.querySelector(".ikoka");

      const name =
        document.querySelector(".ikokaName");

      if (image) {
        image.classList.add("mobileOpen");
      }

      if (name) {
        name.classList.add("mobileOpen");
      }

      return;
    }
  }

  window.location.href = "contact.html";
}

/* =========================
   ENTER YOMIZAKURA
========================= */

function enterSite() {

  const landing =
    document.querySelector(".landing");

  landing.style.opacity = "0";

  setTimeout(() => {

    landing.innerHTML = `

      <div class="world">

        <div class="hubTitle">
          YOMIZAKURA
        </div>

        <div class="hubSubtitle">
          ENTER THE WORLD
        </div>

        <!-- SAKURAMA -->

        <img
          class="sakurama"
          src="./IMG_6692.PNG"
          alt="Sakurama"
          onclick="openSakurama(event)"
        >

        <div
          class="sakuramaName"
          onclick="openSakurama(event)"
        >
          SAKURAMA
          <span>CHARACTERS &amp; WORLD LORE</span>
        </div>

        <!-- FUTURE CHARACTERS -->

        <div class="characterPlaceholder kurogi">
          KUROGI
        </div>

        <div class="characterPlaceholder sakuyo">
          SAKUYO
        </div>

        <div class="characterPlaceholder aoma">
          AOMA
        </div>

        <!-- IKA & IKO -->

        <img
          class="ikoka"
          src="./IMG_6776.PNG"
          alt="Ika and Iko"
          onclick="openIkoka(event)"
        >

        <div
          class="ikokaName"
          onclick="openIkoka(event)"
        >
          IKA · IKO
          <span>INFO &amp; CONTACT</span>
        </div>

        <!-- HUB PETALS -->

        <div class="hubPetal hp1"></div>
        <div class="hubPetal hp2"></div>
        <div class="hubPetal hp3"></div>
        <div class="hubPetal hp4"></div>
        <div class="hubPetal hp5"></div>

      </div>

    `;

    landing.style.opacity = "1";

  }, 800);
}

</script>

</body>
</html>
