<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yomizakura — NonFandomDesigns</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #090609;
  font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   LANDING PAGE
========================= */

.landing {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;

  background:
    radial-gradient(circle at center, #160b16 0%, #090609 65%);

  transition: opacity 0.8s ease;
}

/* TITLE */

.title {
  position: absolute;
  top: 6%;
  left: 50%;
  transform: translateX(-50%);

  z-index: 10;

  color: #ff4fa3;

  font-size: clamp(38px, 6vw, 82px);
  font-weight: 800;

  letter-spacing: 0.18em;
  text-align: center;

  text-shadow:
    0 0 8px rgba(255,79,163,0.7),
    0 0 25px rgba(255,79,163,0.35);
}

.subtitle {
  position: absolute;
  top: 15%;
  left: 50%;
  transform: translateX(-50%);

  z-index: 10;

  color: #ff7ab8;

  font-size: clamp(11px, 1.4vw, 18px);
  letter-spacing: 0.25em;

  text-align: center;
  white-space: nowrap;
}

/* =========================
   TREE
========================= */

.tree {
  position: absolute;

  left: 50%;
  top: 55%;

  width: min(72vw, 760px);
  max-height: 72vh;

  object-fit: contain;

  transform: translate(-50%, -50%);
  transform-origin: 50% 65%;

  z-index: 4;

  filter:
    drop-shadow(0 0 12px rgba(255,79,163,0.18))
    drop-shadow(0 0 35px rgba(255,79,163,0.10));

  animation: treeSway 7s ease-in-out infinite;
}

@keyframes treeSway {
  0%, 100% {
    transform:
      translate(-50%, -50%)
      rotate(-0.7deg)
      scale(1);
  }

  50% {
    transform:
      translate(-50%, -50%)
      rotate(0.7deg)
      scale(1.015);
  }
}

/* =========================
   ENTER BUTTON
========================= */

.enter {
  position: absolute;

  left: 50%;
  bottom: 7%;

  transform: translateX(-50%);

  z-index: 20;

  padding: 14px 28px;

  border: 1px solid #ff4fa3;
  border-radius: 4px;

  background: rgba(9,6,9,0.75);

  color: #ff4fa3;

  font-size: 15px;
  letter-spacing: 0.2em;

  cursor: pointer;

  box-shadow:
    0 0 12px rgba(255,79,163,0.25);

  transition:
    background 0.3s ease,
    color 0.3s ease,
    box-shadow 0.3s ease,
    transform 0.3s ease;
}

.enter:hover {
  background: #ff4fa3;
  color: #090609;

  box-shadow:
    0 0 25px rgba(255,79,163,0.7);

  transform: translateX(-50%) scale(1.05);
}

/* =========================
   FALLING CHERRY BLOSSOMS
========================= */

.petal {
  position: absolute;

  top: -30px;

  width: 7px;
  height: 10px;

  background: #ff77b7;

  border-radius: 70% 30% 70% 30%;

  opacity: 0.8;

  z-index: 6;

  animation-name: fall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.p1 { left: 8%;  animation-duration: 8s;  animation-delay: 0s; }
.p2 { left: 18%; animation-duration: 10s; animation-delay: 2s; }
.p3 { left: 30%; animation-duration: 7s;  animation-delay: 1s; }
.p4 { left: 42%; animation-duration: 11s; animation-delay: 4s; }
.p5 { left: 55%; animation-duration: 8s;  animation-delay: 3s; }
.p6 { left: 67%; animation-duration: 10s; animation-delay: 1s; }
.p7 { left: 78%; animation-duration: 7s;  animation-delay: 5s; }
.p8 { left: 90%; animation-duration: 9s;  animation-delay: 2s; }

@keyframes fall {
  0% {
    transform:
      translate3d(0, -20px, 0)
      rotate(0deg);
  }

  25% {
    transform:
      translate3d(35px, 25vh, 0)
      rotate(90deg);
  }

  50% {
    transform:
      translate3d(-25px, 50vh, 0)
      rotate(180deg);
  }

  75% {
    transform:
      translate3d(40px, 75vh, 0)
      rotate(270deg);
  }

  100% {
    transform:
      translate3d(-10px, 110vh, 0)
      rotate(360deg);
  }
}

/* =========================
   CHARACTER HUB
========================= */

.world {
  position: relative;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  background:
    radial-gradient(circle at center, #180b18 0%, #090609 72%);

  color: #ff4fa3;

  opacity: 0;

  animation: worldFade 1.2s ease forwards;
}

@keyframes worldFade {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

/* HUB TITLE */

.hubTitle {
  position: absolute;

  top: 5%;
  left: 50%;

  transform: translateX(-50%);

  z-index: 10;

  text-align: center;

  color: #ff4fa3;

  font-size: clamp(30px, 5vw, 64px);

  font-weight: 800;

  letter-spacing: 0.18em;

  text-shadow:
    0 0 10px rgba(255,79,163,0.7),
    0 0 30px rgba(255,79,163,0.35);
}

.hubSubtitle {
  position: absolute;

  top: 13%;

  left: 50%;

  transform: translateX(-50%);

  color: #ff7ab8;

  font-size: clamp(10px, 1.2vw, 16px);

  letter-spacing: 0.25em;

  white-space: nowrap;
}

/* =========================
   SAKURAMA
========================= */

.sakurama {
  position: absolute;

  left: 50%;
  top: 53%;

  transform:
    translate(-50%, -50%)
    scale(1);

  width: min(42vw, 500px);
  max-height: 68vh;

  object-fit: contain;

  z-index: 8;

  cursor: pointer;

  filter:
    drop-shadow(0 0 14px rgba(255,79,163,0.35))
    drop-shadow(0 0 40px rgba(255,79,163,0.15));

  transition:
    transform 0.5s ease,
    filter 0.5s ease;
}

.sakurama:hover {
  transform:
    translate(-50%, -50%)
    scale(1.04);

  filter:
    drop-shadow(0 0 20px rgba(255,79,163,0.65))
    drop-shadow(0 0 55px rgba(255,79,163,0.3));
}

/* SAKURAMA NAME */

.sakuramaName {
  position: absolute;

  left: 50%;
  top: 87%;

  transform: translateX(-50%);

  z-index: 12;

  color: #ff4fa3;

  font-size: clamp(18px, 2vw, 28px);

  font-weight: 700;

  letter-spacing: 0.2em;

  opacity: 0.9;

  text-shadow:
    0 0 10px rgba(255,79,163,0.6);

  text-align: center;

  cursor: pointer;

  transition:
    color 0.3s ease,
    text-shadow 0.3s ease;
}

/* WORLD LORE HOVER TEXT */

.sakuramaName span {
  display: block;

  margin-top: 7px;

  color: #ff7ab8;

  font-size: clamp(8px, 0.9vw, 12px);

  letter-spacing: 0.16em;

  opacity: 0;

  transform: translateY(-5px);

  transition:
    opacity 0.3s ease,
    transform 0.3s ease;
}

.sakurama:hover + .sakuramaName,
.sakuramaName:hover {
  color: #ff77b7;

  text-shadow:
    0 0 15px rgba(255,79,163,0.8);
}

.sakuramaName:hover span,
.sakurama:hover + .sakuramaName span {
  opacity: 1;

  transform: translateY(0);
}

/* COMING SOON CHARACTER POSITIONS */

.characterPlaceholder {
  position: absolute;

  z-index: 7;

  color: #ff7ab8;

  font-size: clamp(10px, 1.2vw, 15px);

  letter-spacing: 0.15em;

  opacity: 0.65;

  text-align: center;
}

.kurogi {
  left: 16%;
  top: 30%;
}

.sakuyo {
  left: 18%;
  top: 67%;
}

.aoma {
  right: 18%;
  top: 67%;
}

.ikoka {
  right: 16%;
  top: 30%;
}

/* SUBTLE PETALS ON HUB */

.hubPetal {
  position: absolute;

  width: 6px;
  height: 9px;

  background: #ff77b7;

  border-radius: 70% 30% 70% 30%;

  opacity: 0.65;

  animation: hubFall linear infinite;
}

.hp1 { left: 10%; top: -20px; animation-duration: 9s; }
.hp2 { left: 25%; top: -40px; animation-duration: 12s; animation-delay: 2s; }
.hp3 { left: 45%; top: -30px; animation-duration: 8s; animation-delay: 1s; }
.hp4 { left: 65%; top: -20px; animation-duration: 11s; animation-delay: 3s; }
.hp5 { left: 85%; top: -30px; animation-duration: 9s; animation-delay: 4s; }

@keyframes hubFall {
  0% {
    transform: translate(0, -20px) rotate(0deg);
  }

  50% {
    transform: translate(35px, 50vh) rotate(180deg);
  }

  100% {
    transform: translate(-20px, 110vh) rotate(360deg);
  }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .title {
    top: 5%;
    font-size: 36px;
  }

  .subtitle {
    top: 13%;
    font-size: 9px;
  }

  .tree {
    width: 95vw;
    top: 53%;
  }

  .enter {
    bottom: 5%;
    font-size: 12px;
    padding: 12px 20px;
  }

  .sakurama {
    width: 72vw;
    max-height: 62vh;
  }

  .hubTitle {
    top: 5%;
    font-size: 30px;
  }

  .hubSubtitle {
    top: 13%;
    font-size: 8px;
  }

  .characterPlaceholder {
    font-size: 9px;
  }

  .kurogi {
    left: 7%;
    top: 31%;
  }

  .sakuyo {
    left: 8%;
    top: 70%;
  }

  .aoma {
    right: 8%;
    top: 70%;
  }

  .ikoka {
    right: 7%;
    top: 31%;
  }

  .sakuramaName {
    top: 85%;
  }

  .sakuramaName span {
    font-size: 8px;
    margin-top: 5px;
  }
}
</style>
</head>

<body>

<div class="landing">

  <div class="title">YOMIZAKURA</div>

  <div class="subtitle">
    HANDCRAFTED RUGS · NONFANDOMDESIGNS
  </div>

  <img
    class="tree"
    src="./IMG_6683.PNG"
    alt="Yomizakura"
  >

  <!-- EXISTING CHERRY BLOSSOMS -->

  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="petal p5"></div>
  <div class="petal p6"></div>
  <div class="petal p7"></div>
  <div class="petal p8"></div>

  <button class="enter" onclick="enterSite()">
    ENTER YOMIZAKURA
  </button>

</div>

<script>

function enterSite() {

  const landing = document.querySelector(".landing");

  landing.style.opacity = "0";

  setTimeout(() => {

    landing.innerHTML = `

      <div class="world">

        <div class="hubTitle">
          YOMIZAKURA
        </div>

        <div class="hubSubtitle">
          ENTER THE WORLD
        </div>

        <!-- SAKURAMA -->

        <img
          class="sakurama"
          src="./IMG_6692.PNG"
          alt="Sakurama"
        >

        <div class="sakuramaName">
          SAKURAMA
          <span>CHARACTERS &amp; WORLD LORE</span>
        </div>

        <!-- FUTURE CHARACTERS -->

        <div class="characterPlaceholder kurogi">
          KUROGI
        </div>

        <div class="characterPlaceholder sakuyo">
          SAKUYO
        </div>

        <div class="characterPlaceholder aoma">
          AOMA
        </div>

        <div class="characterPlaceholder ikoka">
          IKO / IKA
        </div>

        <!-- HUB PETALS -->

        <div class="hubPetal hp1"></div>
        <div class="hubPetal hp2"></div>
        <div class="hubPetal hp3"></div>
        <div class="hubPetal hp4"></div>
        <div class="hubPetal hp5"></div>

      </div>

    `;

    /* SHOW THE CHARACTER HUB */
    landing.style.opacity = "1";

  }, 800);
}

</script>

</body>
</html>
