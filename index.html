<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yomizakura</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #050505;
    }

    .tree {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(90vw, 700px);
      height: auto;
      transform: translate(-50%, -50%);
      transform-origin: 50% 75%;
      animation: treeSway 7s ease-in-out infinite;
      user-select: none;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes treeSway {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      25% {
        transform: translate(calc(-50% - 4px), -50%) rotate(-0.6deg);
      }

      50% {
        transform: translate(-50%, calc(-50% + 2px)) rotate(0.5deg);
      }

      75% {
        transform: translate(calc(-50% + 4px), -50%) rotate(-0.3deg);
      }

      100% {
        transform: translate(-50%, -50%) rotate(0deg);
      }
    }

    .petal {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50% 50% 50% 0;
      background: #e8b5c5;
      transform: rotate(45deg);
      opacity: 0;
      z-index: 3;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        opacity: 0;
        transform: translate3d(0, -30px, 0) rotate(45deg);
      }

      10% {
        opacity: 0.9;
      }

      80% {
        opacity: 0.7;
      }

      100% {
        opacity: 0;
        transform: translate3d(180px, 100vh, 0) rotate(420deg);
      }
    }

    .skull {
      position: absolute;
      color: #111;
      font-size: 24px;
      opacity: 0.75;
      z-index: 4;
      animation: floatSkull ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes floatSkull {
      0%,
      100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-18px) rotate(5deg);
      }
    }

    .skull.one {
      left: 18%;
      top: 22%;
      animation-duration: 4.5s;
    }

    .skull.two {
      left: 76%;
      top: 27%;
      font-size: 19px;
      animation-duration: 5.5s;
      animation-delay: -2s;
    }

    .skull.three {
      left: 27%;
      top: 38%;
      font-size: 15px;
      animation-duration: 6s;
      animation-delay: -1s;
    }

    .skull.four {
      left: 70%;
      top: 42%;
      font-size: 17px;
      animation-duration: 5s;
      animation-delay: -3s;
    }

    .blue-flower {
      position: absolute;
      left: 53%;
      top: 63%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2874d8;
      box-shadow:
        0 0 8px rgba(40, 116, 216, 0.7),
        0 0 18px rgba(40, 116, 216, 0.35);
      z-index: 5;
      animation: flowerPulse 3s ease-in-out infinite;
    }

    @keyframes flowerPulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .tree,
      .petal,
      .skull,
      .blue-flower {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="scene">

    <img
      class="tree"
      src="./IMG_6683.PNG"
      alt="Yomizakura"
    />

    <div class="skull one">☠</div>
    <div class="skull two">☠</div>
    <div class="skull three">☠</div>
    <div class="skull four">☠</div>

    <div class="blue-flower"></div>

    <div class="petal" style="left: 12%; animation-duration: 8s; animation-delay: -2s;"></div>
    <div class="petal" style="left: 25%; animation-duration: 10s; animation-delay: -6s;"></div>
    <div class="petal" style="left: 38%; animation-duration: 7s; animation-delay: -1s;"></div>
    <div class="petal" style="left: 52%; animation-duration: 11s; animation-delay: -7s;"></div>
    <div class="petal" style="left: 66%; animation-duration: 9s; animation-delay: -4s;"></div>
    <div class="petal" style="left: 78%; animation-duration: 12s; animation-delay: -9s;"></div>
    <div class="petal" style="left: 90%; animation-duration: 8s; animation-delay: -5s;"></div>

  </div>
</body>
</html>
