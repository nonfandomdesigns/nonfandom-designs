<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yomizakura — NonFandomDesigns</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090609;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .landing {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .title {
      position: absolute;
      top: 8%;
      text-align: center;
      letter-spacing: 0.25em;
      font-size: clamp(32px, 6vw, 72px);
      font-weight: 800;
      z-index: 3;
    }

    .subtitle {
      position: absolute;
      top: 17%;
      font-size: clamp(13px, 2vw, 20px);
      letter-spacing: 0.12em;
      opacity: 0.8;
      z-index: 3;
    }

    .flower {
      position: relative;
      width: min(42vw, 420px);
      height: min(42vw, 420px);
      border-radius: 50%;
      background:
        radial-gradient(circle at center,
          #ff8fba 0%,
          #e84d86 28%,
          #8f174f 58%,
          #35091f 78%,
          transparent 79%);
      box-shadow:
        0 0 35px rgba(255, 70, 140, 0.35),
        0 0 100px rgba(160, 20, 90, 0.2);
      animation: breathe 4s ease-in-out infinite;
      z-index: 2;
    }

    .flower::before,
    .flower::after {
      content: "";
      position: absolute;
      inset: 8%;
      border: 5px solid rgba(20, 5, 15, 0.75);
      border-radius: 48% 52% 50% 50%;
      transform: rotate(25deg);
    }

    .flower::after {
      transform: rotate(-25deg);
    }

    .enter {
      margin-top: 45px;
      padding: 15px 34px;
      border: 1px solid rgba(255, 150, 190, 0.7);
      border-radius: 4px;
      background: rgba(20, 5, 15, 0.8);
      color: white;
      font-size: 16px;
      letter-spacing: 0.16em;
      cursor: pointer;
      z-index: 4;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .enter:hover {
      transform: scale(1.05);
      background: rgba(120, 20, 65, 0.8);
    }

    .skull {
      position: absolute;
      font-size: 24px;
      opacity: 0.55;
      animation: float 5s ease-in-out infinite;
    }

    .s1 { left: 12%; top: 25%; }
    .s2 { right: 14%; top: 31%; animation-delay: 1s; }
    .s3 { left: 22%; bottom: 18%; animation-delay: 2s; }
    .s4 { right: 23%; bottom: 22%; animation-delay: 3s; }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }
  </style>
</head>

<body>
  <main class="landing">

    <div class="title">YOMIZAKURA</div>

    <div class="subtitle">
      HANDCRAFTED RUGS · NONFANDOMDESIGNS
    </div>

    <div class="skull s1">☠</div>
    <div class="skull s2">☠</div>
    <div class="skull s3">☠</div>
    <div class="skull s4">☠</div>

    <div class="flower"></div>

    <button class="enter" onclick="enterSite()">
      ENTER YOMIZAKURA
    </button>

  </main>

  <script>
    function enterSite() {
      alert("Yomizakura awaits...");
    }
  </script>
</body>
</html>
